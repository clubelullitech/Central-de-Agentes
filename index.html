<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal de Assistentes • Piloto</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,Arial;background:#e7eceb;color:#172b26}.app{max-width:780px;margin:auto;min-height:100dvh;background:#f5f8f6;display:flex;flex-direction:column}header{background:#075e54;color:white;padding:16px}header h1{font-size:20px;margin:0 0 4px}small{opacity:.85}.tabs{display:flex;gap:6px;padding:9px;background:#fff}.tabs button{flex:1;border:0;border-radius:12px;padding:12px 4px;background:#e4f2ee;color:#075e54;font-weight:700}.tabs button.active{background:#075e54;color:#fff}.chat{flex:1;min-height:35vh;padding:18px;overflow:auto;background:linear-gradient(120deg,#f3f1eb,#eaf4ee)}.bubble{max-width:86%;padding:12px 14px;border-radius:14px;margin:10px 0;white-space:pre-wrap;line-height:1.45;background:white;box-shadow:0 1px 2px #0001}.mine{background:#d6f6dc;margin-left:auto}.panel{padding:12px;background:#fff;border-top:1px solid #ddd}.panel input,.panel select{width:100%;padding:11px;border:1px solid #cbd5d1;border-radius:9px;margin:4px 0 9px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{background:#128c7e;color:#fff;border:0;border-radius:9px;padding:11px;font-weight:650;cursor:pointer}.outline{background:#e7f3ef;color:#075e54}.composer{display:flex;gap:8px;padding:10px;background:white}.composer input{flex:1;border:1px solid #ccd6d2;border-radius:25px;padding:12px;min-width:0}.composer button{border:0;border-radius:30px;padding:0 20px;background:#128c7e;color:white}.muted{color:#64746f;font-size:12px;padding:4px 12px}h3{margin:6px 0 8px;font-size:15px}label{font-size:12px;color:#54665f}</style></head><body><div class="app"><header><h1>💬 Portal de Assistentes</h1><small>Protótipo gratuito • conversas simuladas • dados neste navegador</small></header><nav class="tabs"><button data-id="salao" class="active">💇 Salão</button><button data-id="pessoal">📅 Pessoal</button><button data-id="biblia">📖 Bíblia</button></nav><main class="chat" id="chat"></main><section class="panel" id="panel"></section><div class="composer"><input id="msg" placeholder="Digite uma mensagem..."><button id="send">Enviar</button></div><div class="muted">Piloto: sem IA real, WhatsApp ou notificações automáticas. Não insira dados sensíveis.</div></div><script>
const names={salao:"Assistente do salão",pessoal:"Secretária pessoal",biblia:"Assistente bíblico"};
let agent="salao";const key="portal-agentes-piloto-v1";let data;try{data=JSON.parse(localStorage.getItem(key))||{}}catch(e){data={}};data.messages ||= {};data.bookings ||= [];data.tasks ||= [];data.bible ||= {tradition:"protestante",start:new Date().toISOString().slice(0,10),done:[]};
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}function el(id){return document.getElementById(id)}function bubble(s,mine=false){let d=document.createElement("div");d.className="bubble"+(mine?" mine":"");d.textContent=s;el("chat").appendChild(d)}
const greetings={salao:"Olá! Sou a assistente do salão. Você pode testar o cadastro de horários e serviços no formulário abaixo.",pessoal:"Olá! Vamos organizar seus compromissos e tarefas? Use o formulário para cadastrar e consultar.",biblia:"Olá! Vamos ler a Bíblia em 365 dias? Escolha a tradição e a data de início para acompanhar seu progresso."};
function render(){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.id===agent));el("chat").replaceChildren();bubble(greetings[agent]);(data.messages[agent]||[]).forEach(x=>bubble(x.text,x.mine));renderPanel();el("chat").scrollTop=el("chat").scrollHeight}
function add(text,mine){(data.messages[agent] ||= []).push({text,mine});save();render()}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderPanel(){let p=el("panel");if(agent==="salao"){p.innerHTML='<h3>Agendamento do salão</h3><input id="client" placeholder="Nome de teste"><select id="service"><option>Corte de cabelo</option><option>Escova</option><option>Manicure</option><option>Pedicure</option></select><div class="grid"><input id="date" type="date"><input id="time" type="time"></div><div class="grid"><button class="action" id="book">Agendar</button><button class="action outline" id="list">Ver agendamentos</button></div>';el("book").onclick=()=>{let n=el("client").value.trim(),dt=el("date").value,t=el("time").value,s=el("service").value;if(!n||!dt||!t)return alert("Informe nome, data e horário.");if(data.bookings.some(x=>x.date===dt&&x.time===t))return alert("Horário ocupado no piloto.");data.bookings.push({name:n,date:dt,time:t,service:s});add("Agendamento simulado confirmado: "+n+", "+s+", "+dt+" às "+t+".",false)};el("list").onclick=()=>add(data.bookings.length?data.bookings.map((x,i)=>(i+1)+". "+x.name+" • "+x.service+" • "+x.date+" "+x.time).join("\n"):"Ainda não há agendamentos.",false)}
else if(agent==="pessoal"){p.innerHTML='<h3>Compromissos e tarefas</h3><input id="task" placeholder="Ex.: Fazer lição de matemática"><select id="kind"><option>Compromisso</option><option>Tarefa de casa</option><option>Tarefa escolar</option><option>Consulta</option></select><div class="grid"><input id="date" type="date"><input id="time" type="time"></div><div class="grid"><button class="action" id="add">Cadastrar</button><button class="action outline" id="list">Ver tarefas</button></div>';el("add").onclick=()=>{let t=el("task").value.trim(),d=el("date").value,h=el("time").value,k=el("kind").value;if(!t||!d)return alert("Informe a tarefa e a data.");data.tasks.push({text:t,date:d,time:h,kind:k,done:false});add("Registrado: "+k+" — "+t+" em "+d+(h?" às "+h:"")+".",false)};el("list").onclick=()=>add(data.tasks.length?data.tasks.map((x,i)=>(i+1)+". "+(x.done?"✓ ":"○ ")+x.kind+": "+x.text+" — "+x.date+(x.time?" "+x.time:"")).join("\n"):"Nenhuma tarefa cadastrada.",false)}
else{let b=data.bible;let today=Math.max(1,Math.floor((new Date().setHours(12,0,0,0)-new Date(b.start+"T12:00:00").getTime())/86400000)+1);p.innerHTML='<h3>Plano de leitura de 365 dias</h3><label>Tradição bíblica</label><select id="trad"><option value="protestante">Protestante — 66 livros</option><option value="catolica">Católica — 73 livros</option></select><label>Data de início</label><input id="start" type="date"><div class="grid"><button class="action" id="reading">Leitura de hoje</button><button class="action outline" id="done">Marcar dia concluído</button></div><button class="action outline" style="width:100%;margin-top:8px" id="speak">🔊 Ouvir referência</button>';el("trad").value=b.tradition;el("start").value=b.start;el("trad").onchange=e=>{b.tradition=e.target.value;b.done=[];save();render()};el("start").onchange=e=>{if(e.target.value){b.start=e.target.value;b.done=[];save();render()}};let total=b.tradition==="catolica"?1334:1189;let day=Math.min(365,today);let from=Math.floor((day-1)*total/365)+1,to=Math.floor(day*total/365);let description="Dia "+day+"/365 • capítulos "+from+" a "+to+" na sequência canônica da Bíblia "+(b.tradition==="catolica"?"católica":"protestante")+".\nEste piloto ainda não contém o índice de livros e versículos. O cálculo é apenas uma demonstração da divisão anual.";el("reading").onclick=()=>add(description,false);el("done").onclick=()=>{if(!b.done.includes(day))b.done.push(day);save();add("Leitura do dia "+day+" marcada como concluída! Total de dias concluídos: "+b.done.length+".",false)};el("speak").onclick=()=>{if(!("speechSynthesis" in window))return alert("Seu navegador não suporta leitura em voz alta.");let u=new SpeechSynthesisUtterance(description);u.lang="pt-BR";speechSynthesis.speak(u)}}
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{agent=b.dataset.id;render()});function send(){let s=el("msg").value.trim();if(!s)return;el("msg").value="";add(s,true);let a=agent;setTimeout(()=>{if(agent!==a)return;let answer=a==="salao"?"Posso ajudar a testar agendamentos. Preencha nome, serviço, data e horário no formulário.":a==="pessoal"?"Para registrar uma tarefa ou compromisso, preencha os campos abaixo.":"Configure sua tradição e data de início. Depois toque em Leitura de hoje.";add(answer,false)},250)}el("send").onclick=send;el("msg").addEventListener("keydown",e=>{if(e.key==="Enter")send()});render();
</script></body></html>
